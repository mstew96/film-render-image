# procedure-film kit v2.0: GitHub Actions workflow that builds the film image and pushes it to GitHub's image storage
# (ghcr.io). Lives at .github/workflows/build-film-image.yml in the small image repo that kit/cloud/image/publish.sh
# creates. Uses the workflow's own GITHUB_TOKEN (packages: write), so no extra token or password is needed.
name: build-film-image
on:
  workflow_dispatch: {}
  push:
    paths: [Dockerfile]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (base image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG=$(cat TAG)
          docker build -t ghcr.io/$OWNER/film-render:$TAG .
          docker run --rm --entrypoint /opt/blender/blender ghcr.io/$OWNER/film-render:$TAG --version | head -1
          docker push ghcr.io/$OWNER/film-render:$TAG
          echo "IMAGE ghcr.io/$OWNER/film-render:$TAG" >> $GITHUB_STEP_SUMMARY
